[project]
name = "music_core"
version = "0.1.1"
description = "Core music and Spotify client library for music management and artist visualization"
authors = [
    { name = "Vant & Antigravity", email = "vant@example.com" }
]
dependencies = [
    "spotipy>=2.24.0",
    "pydantic-settings>=2.2.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0"
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["music_core"]
